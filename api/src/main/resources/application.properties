spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1248}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-padrao-para-desenvolvimento-local}

api.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}