<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthApp - Criar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <i class="fa-solid fa-user-lock logo"></i>
            <span class="logo-text">AuthApp</span>
        </div>
    </header>
    <main class="container">
        <div class="form-header">
            <h2 class="title-form-header">Criar Conta</h2>
            <p class="paragraph-form-header">Preencha seus dados de acesso</p>
        </div>

        <div id="mensagem-feedback" class="feedback-message" style="display: none;"></div>

        <div class="form-card">
            <form id="form-cadastro">
                <div class="field name">
                    <label for="nome" class="text-field">Nome completo</label>
                    <input 
                        type="text" 
                        id="nome"
                        name="nome" 
                        placeholder="Digite seu nome completo" 
                        autocomplete="name"
                        required    
                    >
                </div>

                <div class="field email">
                    <label for="email" class="text-field">E-mail</label>
                    <input 
                        type="email" 
                        id="email"
                        name="email" 
                        placeholder="seu@email.com" 
                        autocomplete="email"
                        required    
                    >
                </div>

                <div class="field password-field">
                    <label for="senha" class="text-field">Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo 6 caracteres"
                            minlength="6"
                            required
                        >
                        <i class="fa-solid fa-eye-slash toggle-password" id="toggle-senha"></i>
                    </div>
                </div>

                <div class="field password-field">
                    <label for="confirmarSenha" class="text-field">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Repita a senha"
                            minlength="6"
                            required
                        >
                        <i class="fa-solid fa-eye-slash toggle-password" id="toggle-confirmarSenha"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Cadastrar</button>

                <div class="form-footer">
                    <p>Já tem uma conta? <a href="index.html"><span>Faça login</span></a></p>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="js/pages/cadastro.js"></script>
</body>
</html>
